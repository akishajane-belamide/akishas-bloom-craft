<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | BloomCraft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
    <h1>Contact BloomCraft</h1>
     <p>We would love to hear from you!</p>
    </header>

    <section>
      <h2>Visit Our Shop</h2>
      <p>Address: 123 Floral Lane, Garden District</p>
      <p>Hours: Mon - Sat: 8:00 AM - 6:00 PM</p>
      <p>Email: akishabelamide@gmail.com</p>
      <p>Phone: 09941701870</p>
    </section>

    <form>

      <fieldset>
        <legend>Your Details</legend>

        <label for="name">Name</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="subject">Subject</label><br>
        <select id="subject" name="subject">
        <option value="product-question">Product Question</option>
        <option value="order-status">Order Status</option>
        <option value="custom-order">Custom Order Request</option>
        <option value="wholesale-enquiry">Wholesale Enquiry</option>
        <option value="other">Other</option>
        </select><br><br>

        <label for="message">Message</label><br>
        <textarea id="message" name="message" rows="6" cols="40" required></textarea><br><br>

        <button type="submit">Send Message</button>
      </fieldset>

    </form>
  
    <footer>
     <p>BloomCraft Akisha Belamide &middot; 2026</p>
      </footer>

</body>
</html>
